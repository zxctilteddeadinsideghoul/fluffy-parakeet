services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
      - "6006:6006"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      BACKEND_ENVIRONMENT: development
      BACKEND_DATABASE_URL: sqlite:////app/data/app.db
    volumes:
      - ./backend/data:/app/data
