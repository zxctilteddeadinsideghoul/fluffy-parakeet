services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
      - "6006:6006"
    environment:
      # Proxy target, resolved by the dev server inside the network — so it uses
      # the Compose service name. The browser only ever calls /api on :5173.
      BACKEND_ORIGIN: http://backend:8000
      VITE_DEV_USER_ID: ${VITE_DEV_USER_ID:-}
      # Bind mounts do not deliver file events into the container on Windows/macOS.
      VITE_WATCH_POLLING: "true"
    volumes:
      # Live-reload the source; keep the image's node_modules (built for Alpine).
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "8000:8000"
    environment:
      BACKEND_ENVIRONMENT: development
      BACKEND_DATABASE_URL: sqlite+aiosqlite:////app/data/app.db
      BACKEND_MEDIA_BASE_URL: http://localhost:8000
      BACKEND_PHOTO_STORAGE_BACKEND: minio
      BACKEND_MINIO_ENDPOINT: minio:9000
      BACKEND_MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      BACKEND_MINIO_ACCESS_KEY: minioadmin
      BACKEND_MINIO_SECRET_KEY: minioadmin
      BACKEND_MINIO_BUCKET: fluffy-parakeet
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data
      - ./backend/media:/app/media

volumes:
  minio-data:
